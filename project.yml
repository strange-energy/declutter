name: SwipeDeck
options:
  bundleIdPrefix: com.swipedeck
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone Native
targets:
  SwipeDeck:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: SwipeDeck
    info:
      path: SwipeDeck/App/Info.plist
      properties:
        CFBundleDisplayName: SwipeDeck
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CADisableMinimumFrameDurationOnPhone: true
        NSPhotoLibraryUsageDescription: "SwipeDeck needs full access to your photo library so you can triage, review, and batch-delete unwanted photos and videos to reclaim storage."
        NSPhotoLibraryAddUsageDescription: "SwipeDeck organises and manages your photo library during decluttering sessions."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swipedeck.app
        INFOPLIST_FILE: SwipeDeck/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        DEVELOPMENT_TEAM: ""
