name: Build Unsigned iOS IPA

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-ipa:
    name: Compile SwipeDeck.ipa (macOS + Xcode 16)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          if ! command -v xcodegen &> /dev/null; then
            brew install xcodegen
          fi

      - name: Generate Xcode Project from project.yml
        run: xcodegen generate

      - name: Build Unsigned Release App for iOS Device (arm64)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SwipeDeck.xcodeproj \
            -scheme SwipeDeck \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee xcodebuild.log

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-error-log
          path: xcodebuild.log

      - name: Package Payload into SwipeDeck.ipa
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/SwipeDeck.app Payload/
          zip -r9 SwipeDeck.ipa Payload

      - name: Upload SwipeDeck.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwipeDeck-iOS-IPA
          path: SwipeDeck.ipa
          if-no-files-found: error
          retention-days: 30
